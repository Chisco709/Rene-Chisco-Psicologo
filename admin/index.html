<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow">
  <title>Panel de edición · René Chisco</title>
</head>
<body>
  <script>
    window.CMS_MANUAL_INIT = true;
  </script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    CMS.init({
      config: {
        backend: {
          name: "github",
          repo: "Chisco709/Rene-Chisco-Psicologo",
          branch: "main",
          base_url: "https://www.renefernandochisco.com",
          auth_endpoint: "api/auth"
        },
        // Cada cambio crea un borrador (Pull Request) con vista previa en Vercel
        // en vez de publicarse directo. Si quieres reducir peticiones a GitHub
        // mientras pruebas, puedes comentar esta línea temporalmente y volver
        // a activarla cuando todo funcione bien.
        publish_mode: "editorial_workflow",
        media_folder: "assets/img/uploads",
        public_folder: "/assets/img/uploads",
        locale: "es",
        collections: [
          {
            name: "inicio",
            label: "Página de inicio",
            files: [
              {
                label: "Contenido de la portada",
                name: "home",
                file: "data/home.json",
                fields: [
                  {
                    label: "Encabezado principal (Hero)",
                    name: "hero",
                    widget: "object",
                    fields: [
                      { label: "Texto pequeño superior", name: "eyebrow", widget: "string" },
                      { label: "Título (parte normal)", name: "title", widget: "string" },
                      { label: "Título (parte resaltada)", name: "title_highlight", widget: "string" },
                      { label: "Párrafo de introducción", name: "lead", widget: "text" },
                      { label: "Texto botón principal", name: "cta_primary_label", widget: "string" },
                      { label: "Texto botón secundario", name: "cta_secondary_label", widget: "string" },
                      {
                        label: "Estadísticas (los 4 números)",
                        name: "stats",
                        widget: "list",
                        min: 1,
                        max: 4,
                        fields: [
                          { label: "Número / valor", name: "value", widget: "string" },
                          { label: "Descripción", name: "label", widget: "string" }
                        ]
                      },
                      { label: "Texto bajo la rueda de la vida", name: "wheel_caption", widget: "text" }
                    ]
                  },
                  {
                    label: "Bloque 'Sobre mí' (resumen)",
                    name: "about_teaser",
                    widget: "object",
                    fields: [
                      { label: "Texto pequeño superior", name: "eyebrow", widget: "string" },
                      { label: "Título", name: "title", widget: "string" },
                      { label: "Párrafo", name: "body", widget: "text" },
                      { label: "Texto del enlace", name: "link_label", widget: "string" }
                    ]
                  },
                  {
                    label: "Bloque 'Especialidades' (resumen)",
                    name: "especialidades_teaser",
                    widget: "object",
                    fields: [
                      { label: "Texto pequeño superior", name: "eyebrow", widget: "string" },
                      { label: "Título", name: "title", widget: "string" },
                      { label: "Texto del enlace", name: "link_label", widget: "string" },
                      {
                        label: "Especialidades listadas",
                        name: "items",
                        widget: "list",
                        field: { label: "Nombre", name: "item", widget: "string" }
                      }
                    ]
                  },
                  {
                    label: "Bloque 'Retos de 30 días' (resumen)",
                    name: "retos_teaser",
                    widget: "object",
                    fields: [
                      { label: "Texto pequeño superior", name: "eyebrow", widget: "string" },
                      { label: "Título", name: "title", widget: "string" },
                      { label: "Texto del enlace", name: "link_label", widget: "string" },
                      { label: "Párrafo introductorio", name: "intro", widget: "text" },
                      {
                        label: "Tarjetas de retos destacadas",
                        name: "preview_cards",
                        widget: "list",
                        min: 1,
                        max: 3,
                        fields: [
                          { label: "Título del reto", name: "title", widget: "string" },
                          { label: "Descripción", name: "description", widget: "string" },
                          { label: "Etiqueta", name: "tag", widget: "string" },
                          {
                            label: "Color",
                            name: "color",
                            widget: "select",
                            options: ["wheel-1", "wheel-2", "wheel-3", "wheel-4", "wheel-5", "wheel-6", "wheel-7"]
                          }
                        ]
                      }
                    ]
                  },
                  {
                    label: "Bloque 'Opiniones' (resumen)",
                    name: "opiniones_teaser",
                    widget: "object",
                    fields: [
                      { label: "Texto pequeño superior", name: "eyebrow", widget: "string" },
                      { label: "Título", name: "title", widget: "string" },
                      { label: "Texto del enlace", name: "link_label", widget: "string" }
                    ]
                  },
                  {
                    label: "Franja final (llamado a la acción)",
                    name: "cta_final",
                    widget: "object",
                    fields: [
                      { label: "Texto pequeño superior", name: "eyebrow", widget: "string" },
                      { label: "Título", name: "title", widget: "string" },
                      { label: "Texto botón principal", name: "cta_primary_label", widget: "string" },
                      { label: "Texto botón secundario", name: "cta_secondary_label", widget: "string" }
                    ]
                  }
                ]
              }
            ]
          },
          {
            name: "blog",
            label: "Blog",
            files: [
              {
                label: "Blog",
                name: "blog",
                file: "data/blog.json",
                fields: [
                  {
                    label: "Encabezado del blog",
                    name: "hero",
                    widget: "object",
                    fields: [
                      { label: "Texto pequeño superior", name: "eyebrow", widget: "string" },
                      { label: "Título", name: "title", widget: "string" },
                      { label: "Descripción", name: "description", widget: "text" }
                    ]
                  },
                  {
                    label: "Artículos",
                    name: "articles",
                    widget: "list",
                    summary: "{{title}}",
                    fields: [
                      { label: "Identificador", name: "id", widget: "string", hint: "No lo cambies si el artículo ya existe: se usa como enlace interno." },
                      { label: "Archivo del artículo (déjalo vacío si aún no existe)", name: "url", widget: "string", required: false },
                      { label: "Categoría", name: "category", widget: "select", options: ["Coaching", "Transformación personal", "Salud mental", "Logoterapia", "Oratoria"] },
                      { label: "Título del artículo", name: "title", widget: "string" },
                      { label: "Resumen / extracto", name: "excerpt", widget: "text" },
                      { label: "Tiempo de lectura", name: "readTime", widget: "string" },
                      { label: "Color inicial", name: "colorFrom", widget: "select", options: ["wheel-1", "wheel-2", "wheel-3", "wheel-4", "wheel-5", "wheel-6", "wheel-7"] },
                      { label: "Color final", name: "colorTo", widget: "select", options: ["wheel-1", "wheel-2", "wheel-3", "wheel-4", "wheel-5", "wheel-6", "wheel-7"] },
                      { label: "Ícono", name: "icon", widget: "select", options: ["wheel", "calendar", "mind", "target", "mic", "book"] },
                      { label: "¿Publicado?", name: "published", widget: "boolean", default: false, hint: "Actívalo solo cuando el archivo del artículo ya esté listo y subido." }
                    ]
                  }
                ]
              }
            ]
          },
          {
            name: "precios",
            label: "Precios",
            files: [
              {
                label: "Tabla de precios",
                name: "precios",
                file: "data/precios.json",
                fields: [
                  {
                    label: "Atención personal",
                    name: "personal",
                    widget: "list",
                    fields: [
                      { label: "Servicio", name: "nombre", widget: "string" },
                      { label: "Descripción (opcional)", name: "descripcion", widget: "string", required: false },
                      { label: "Precio", name: "precio", widget: "string" }
                    ]
                  },
                  {
                    label: "Empresarial",
                    name: "empresarial",
                    widget: "list",
                    fields: [
                      { label: "Servicio", name: "nombre", widget: "string" },
                      { label: "Descripción (opcional)", name: "descripcion", widget: "string", required: false },
                      { label: "Precio", name: "precio", widget: "string" }
                    ]
                  },
                  { label: "Nota al pie", name: "nota", widget: "text" }
                ]
              }
            ]
          },
          {
            name: "testimonios",
            label: "Opiniones de pacientes",
            files: [
              {
                label: "Lista de opiniones",
                name: "testimonios",
                file: "data/testimonios.json",
                fields: [
                  {
                    label: "Opiniones",
                    name: "lista",
                    widget: "list",
                    fields: [
                      { label: "Texto de la opinión", name: "texto", widget: "text" },
                      { label: "Firma", name: "autor", widget: "string", default: "Paciente" }
                    ]
                  }
                ]
              }
            ]
          },
          {
            name: "especialidades",
            label: "Especialidades",
            files: [
              {
                label: "Página de especialidades",
                name: "especialidades",
                file: "data/especialidades.json",
                fields: [
                  {
                    label: "Encabezado", name: "hero", widget: "object",
                    fields: [
                      { label: "Texto pequeño superior", name: "eyebrow", widget: "string" },
                      { label: "Título", name: "title", widget: "string" }
                    ]
                  },
                  {
                    label: "Las 4 especialidades", name: "especialidades", widget: "list", min: 1, max: 4,
                    fields: [
                      { label: "Nombre", name: "titulo", widget: "string" },
                      { label: "Descripción", name: "descripcion", widget: "text" }
                    ]
                  },
                  { label: "Título de la lista de áreas", name: "areas_titulo", widget: "string" },
                  {
                    label: "Áreas de acompañamiento", name: "areas", widget: "list",
                    field: { label: "Área", name: "area", widget: "string" }
                  },
                  {
                    label: "Franja final", name: "cta", widget: "object",
                    fields: [ { label: "Título", name: "titulo", widget: "string" } ]
                  }
                ]
              }
            ]
          },
          {
            name: "retos",
            label: "Retos de 30 días",
            files: [
              {
                label: "Los 7 Retos",
                name: "retos",
                file: "data/retos.json",
                fields: [
                  {
                    label: "Encabezado de la página", name: "hero", widget: "object",
                    fields: [
                      { label: "Texto pequeño superior", name: "eyebrow", widget: "string" },
                      { label: "Título", name: "title", widget: "string" },
                      { label: "Descripción", name: "descripcion", widget: "text" }
                    ]
                  },
                  {
                    label: "Retos", name: "retos", widget: "list", min: 7, max: 7,
                    summary: "{{titulo}} — {{fields.estado}}",
                    fields: [
                      { label: "Identificador (no cambiar)", name: "id", widget: "string", hint: "Se usa como enlace interno, no lo modifiques." },
                      { label: "Color", name: "color", widget: "select", options: ["wheel-1","wheel-2","wheel-3","wheel-4","wheel-5","wheel-6","wheel-7"] },
                      { label: "Título del reto", name: "titulo", widget: "string" },
                      { label: "Subtítulo / gancho", name: "subtitulo", widget: "text" },
                      { label: "Etiqueta", name: "etiqueta", widget: "string" },
                      { label: "Estado", name: "estado", widget: "select", options: [{label: "Disponible", value: "disponible"}, {label: "Próximamente", value: "proximamente"}] },
                      { label: "Frase / cita destacada (opcional)", name: "cita", widget: "string", required: false },
                      { label: "Párrafos introductorios", name: "parrafos", widget: "list", field: { label: "Párrafo", name: "texto", widget: "text" } },
                      { label: "Título sección extra (opcional)", name: "seccion_extra_titulo", widget: "string", required: false },
                      { label: "Texto sección extra (opcional)", name: "seccion_extra_texto", widget: "text", required: false },
                      { label: "Título del bloque de sesiones/puntos", name: "bloque_titulo", widget: "string", required: false },
                      {
                        label: "Sesiones o puntos clave", name: "bloque_items", widget: "list", required: false,
                        fields: [
                          { label: "Título", name: "titulo", widget: "string" },
                          { label: "Descripción", name: "texto", widget: "text" }
                        ]
                      },
                      { label: "Párrafo de cierre (opcional)", name: "parrafo_final", widget: "text", required: false },
                      { label: "Precio de contado", name: "precio_contado", widget: "string", required: false },
                      { label: "Etiqueta del precio de contado", name: "precio_contado_label", widget: "string", required: false },
                      { label: "Precio diferido", name: "precio_diferido", widget: "string", required: false },
                      { label: "Etiqueta del precio diferido", name: "precio_diferido_label", widget: "string", required: false },
                      { label: "Texto del botón", name: "cta_texto", widget: "string" }
                    ]
                  }
                ]
              }
            ]
          },
          {
            name: "multimedia",
            label: "Multimedia",
            files: [
              {
                label: "Galería",
                name: "multimedia",
                file: "data/multimedia.json",
                fields: [
                  {
                    label: "Encabezado", name: "hero", widget: "object",
                    fields: [
                      { label: "Texto pequeño superior", name: "eyebrow", widget: "string" },
                      { label: "Título", name: "title", widget: "string" }
                    ]
                  },
                  {
                    label: "Elementos de la galería", name: "items", widget: "list",
                    summary: "{{fields.tipo}}",
                    fields: [
                      { label: "Tipo", name: "tipo", widget: "select", options: [{label: "Foto", value: "foto"}, {label: "Video de YouTube", value: "video"}] },
                      { label: "Foto (solo si el tipo es Foto)", name: "imagen", widget: "image", required: false },
                      { label: "Texto alternativo (solo Foto)", name: "alt", widget: "string", required: false },
                      { label: "ID del video de YouTube (solo si el tipo es Video)", name: "youtube_id", widget: "string", required: false, hint: "Es la parte final del link, ej: en youtube.com/watch?v=64cEdWdFNeU el ID es 64cEdWdFNeU" }
                    ]
                  }
                ]
              }
            ]
          },
          {
            name: "sitio",
            label: "Datos de contacto y redes",
            files: [
              {
                label: "Configuración global",
                name: "site",
                file: "data/site.json",
                fields: [
                  {
                    label: "Psicólogo",
                    name: "psicologo",
                    widget: "object",
                    fields: [
                      { label: "Nombre completo", name: "nombre", widget: "string" },
                      { label: "Número de colegiado", name: "colegiado", widget: "string" }
                    ]
                  },
                  {
                    label: "Contacto",
                    name: "contacto",
                    widget: "object",
                    fields: [
                      { label: "Teléfono", name: "telefono", widget: "string" },
                      { label: "WhatsApp (solo números, con indicativo)", name: "whatsapp_numero", widget: "string" },
                      { label: "Mensaje predeterminado de WhatsApp", name: "whatsapp_mensaje", widget: "string" },
                      { label: "Dirección", name: "direccion", widget: "string" },
                      { label: "Ciudad", name: "ciudad", widget: "string" },
                      { label: "Departamento", name: "departamento", widget: "string" },
                      { label: "Código postal", name: "codigo_postal", widget: "string" },
                      { label: "País", name: "pais", widget: "string" }
                    ]
                  },
                  {
                    label: "Redes sociales",
                    name: "redes_sociales",
                    widget: "object",
                    fields: [
                      { label: "Instagram", name: "instagram", widget: "string" },
                      { label: "YouTube", name: "youtube", widget: "string" },
                      { label: "X (Twitter)", name: "x", widget: "string" }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      }
    });
  </script>
</body>
</html>
