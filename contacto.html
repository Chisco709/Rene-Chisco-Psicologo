<link rel="stylesheet" href="assets/css/style.css">

</head>
<body>
  <style>
    :root{
    --ink:#1c2b24;
    --paper:#f2eee2;
    --card:#faf8f1;
    --moss:#3f5a4d;
    --moss-deep:#2a4038;
    --ochre:#b8863e;
    --clay:#a6503b;
    --line: rgba(28,43,36,.14);
    --wheel-1:#3f5a4d; /* felicidad */
    --wheel-2:#b8863e; /* sistema de exito */
    --wheel-3:#a6503b; /* historia/crecimiento */
    --wheel-4:#2a4038; /* mentalidad */
    --wheel-5:#c79a52; /* oratoria */
    --wheel-6:#6f8a72; /* proposito */
    --wheel-7:#8a4a3a; /* resiliencia */
    --radius: 18px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Karla',sans-serif;
    font-size:16px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{
    font-family:'Fraunces',serif;
    font-weight:450;
    margin:0 0 .4em 0;
    letter-spacing:-.01em;
  }
  a{color:inherit;}
  img{max-width:100%;display:block;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 28px;}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--moss);
    display:flex;
    align-items:center;
    gap:10px;
  }
  .eyebrow::before{content:"";width:22px;height:1px;background:var(--clay);display:inline-block;}
  section{padding:96px 0;}
  @media(max-width:720px){section{padding:64px 0;}}
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    font-family:'Karla',sans-serif;font-weight:600;font-size:15px;
    padding:14px 26px;border-radius:100px;
    text-decoration:none;border:1px solid transparent;
    transition:transform .2s ease, background .2s ease;
  }
  .btn-solid{background:var(--ink);color:var(--paper);}
  .btn-solid:hover{transform:translateY(-2px);background:var(--moss-deep);}
  .btn-line{border-color:var(--ink);color:var(--ink);}
  .btn-line:hover{transform:translateY(-2px);background:var(--ink);color:var(--paper);}

  /* HEADER */
  header{
    position:sticky;top:0;z-index:50;
    background:rgba(242,238,226,.86);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  header .wrap{display:flex;align-items:center;justify-content:space-between;padding-top:16px;padding-bottom:16px;}
  .brand{display:flex;align-items:center;gap:10px;font-family:'Fraunces',serif;font-size:19px;text-decoration:none;color:var(--ink);}
  .brand-mark{
    width:34px;height:34px;border-radius:50%;
    background:conic-gradient(var(--wheel-1) 0 51.4deg,var(--wheel-2) 0 102.8deg,var(--wheel-3) 0 154.2deg,var(--wheel-4) 0 205.6deg,var(--wheel-5) 0 257deg,var(--wheel-6) 0 308.4deg,var(--wheel-7) 0 360deg);
    flex:none;
  }
  nav.mainnav{display:flex;gap:28px;font-size:14.5px;}
  nav.mainnav a{text-decoration:none;opacity:.78;}
  nav.mainnav a:hover{opacity:1;}
  header .btn{padding:10px 20px;font-size:13.5px;}
  .navtoggle{display:none;background:none;border:none;font-family:'Fraunces',serif;font-size:15px;cursor:pointer;color:var(--ink);}
  @media(max-width:880px){
    nav.mainnav{display:none;}
    .navtoggle{display:block;}
  }

  /* HERO */
  .hero .wrap{
    display:grid;grid-template-columns:1.05fr .95fr;gap:60px;align-items:center;
    padding-top:64px;padding-bottom:32px;
  }
  @media(max-width:960px){.hero .wrap{grid-template-columns:1fr;}}
  .hero h1{font-size:clamp(34px,5vw,58px);line-height:1.04;margin-top:14px;}
  .hero h1 em{font-style:italic;color:var(--clay);}
  .hero p.lead{font-size:18px;max-width:46ch;color:#3a4941;margin-top:18px;}
  .hero-ctas{display:flex;gap:14px;margin-top:32px;flex-wrap:wrap;}
  .hero-stats{display:flex;gap:32px;margin-top:44px;padding-top:28px;border-top:1px solid var(--line);flex-wrap:wrap;}
  .hero-stats div b{display:block;font-family:'Fraunces',serif;font-size:26px;}
  .hero-stats div span{font-size:12.5px;color:#5a6a61;font-family:'IBM Plex Mono',monospace;}

  /* WHEEL */
  .wheel-block{display:flex;flex-direction:column;align-items:center;}
  #wheel-wrap{position:relative;width:min(380px,86vw);aspect-ratio:1/1;}
  #wheel-svg{width:100%;height:100%;display:block;}
  .wheel-seg{cursor:pointer;transition:opacity .25s ease, transform .25s ease;transform-origin:center;}
  .wheel-seg:hover, .wheel-seg.active{opacity:.82;}
  .wheel-center{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;text-align:center;pointer-events:none;width:42%;height:42%;margin:auto;
  }
  .wheel-center b{font-family:'Fraunces',serif;font-size:13px;line-height:1.15;color:var(--ink);}
  .wheel-center span{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--moss);margin-top:4px;letter-spacing:.04em;}
  .wheel-caption{font-size:13px;color:#5a6a61;text-align:center;max-width:280px;margin-top:18px;}
  .wheel-labels{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
  .wheel-labels li{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:5px 10px;border-radius:100px;
    border:1px solid var(--line);cursor:pointer;transition:.2s ease;color:#4a5850;
  }
  .wheel-labels li:hover,.wheel-labels li.active{border-color:var(--ink);color:var(--ink);background:var(--card);}

  /* SOBRE MI */
  .about-grid{display:grid;grid-template-columns:.9fr 1.4fr;gap:56px;align-items:start;}
  @media(max-width:860px){.about-grid{grid-template-columns:1fr;}}
  .about-photo{border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);}
  .facts{margin-top:24px;display:grid;gap:14px;}
  .fact{border-top:1px solid var(--line);padding-top:12px;}
  .fact b{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--moss);display:block;margin-bottom:4px;}
  .about-text p{color:#3a4941;font-size:16.5px;}
  .about-text .quote{
    font-family:'Fraunces',serif;font-style:italic;font-size:22px;line-height:1.4;
    color:var(--moss-deep);border-left:2px solid var(--clay);padding-left:22px;margin:28px 0;
  }

  /* SPECIALTIES */
  .specialty-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:40px;}
  @media(max-width:900px){.specialty-grid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:520px){.specialty-grid{grid-template-columns:1fr;}}
  .specialty-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;}
  .specialty-card .num{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--clay);}
  .specialty-card h3{font-size:19px;margin-top:10px;}
  .specialty-card p{font-size:14px;color:#5a6a61;margin:0;}
  .tag-cloud{display:flex;flex-wrap:wrap;gap:9px;margin-top:36px;}
  .tag-cloud span{
    font-size:13px;padding:7px 14px;border-radius:100px;background:var(--card);
    border:1px solid var(--line);color:#3a4941;
  }

  /* RETOS */
  .retos{background:var(--ink);color:var(--paper);}
  .retos .eyebrow{color:#b9c9bd;}
  .retos .eyebrow::before{background:var(--ochre);}
  .retos-intro{max-width:60ch;color:#cfd8cf;}
  .reto-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,.14);margin-top:48px;border:1px solid rgba(255,255,255,.14);}
  @media(max-width:960px){.reto-grid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:620px){.reto-grid{grid-template-columns:1fr;}}
  .reto-card{background:var(--ink);padding:30px 26px;min-height:220px;display:flex;flex-direction:column;}
  .reto-card .swatch{width:26px;height:26px;border-radius:50%;margin-bottom:18px;}
  .reto-card h3{font-size:18.5px;color:#fff;line-height:1.2;}
  .reto-card p{font-size:13.8px;color:#b9c2ba;margin:8px 0 0;flex:1;}
  .reto-card .tag{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#8a988e;margin-top:16px;}

  /* CUESTIONARIO */
  #quiz-box{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:40px;margin-top:40px;
  }
  @media(max-width:600px){#quiz-box{padding:26px 20px;}}
  .quiz-q{display:none;}
  .quiz-q.active{display:block;animation:fadein .4s ease;}
  .quiz-q .qnum{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--clay);letter-spacing:.06em;}
  .quiz-q h3{font-size:22px;margin-top:8px;max-width:32ch;}
  .quiz-options{list-style:none;margin:22px 0 0;padding:0;display:grid;gap:10px;}
  .quiz-options li{
    border:1px solid var(--line);border-radius:12px;padding:14px 18px;cursor:pointer;
    font-size:14.5px;color:#3a4941;transition:.2s ease;display:flex;gap:12px;align-items:baseline;
  }
  .quiz-options li:hover{border-color:var(--moss);}
  .quiz-options li.selected{border-color:var(--clay);background:#fff;color:var(--ink);}
  .quiz-options li .letter{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--moss);flex:none;}
  .quiz-nav{display:flex;align-items:center;justify-content:space-between;margin-top:30px;gap:16px;flex-wrap:wrap;}
  .quiz-nav .btn{padding:11px 22px;font-size:13.5px;}
  .quiz-progress{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#5a6a61;}
  #quiz-result{
    background:var(--ink);color:var(--paper);border-radius:var(--radius);padding:44px;margin-top:24px;
  }
  #quiz-result .eyebrow{color:#b9c9bd;}
  #quiz-result .eyebrow::before{background:var(--ochre);}
  #quiz-result h3{color:#fff;font-size:clamp(24px,3vw,32px);max-width:24ch;}
  #quiz-result p:not(.eyebrow){color:#c3cec5;max-width:60ch;margin-top:10px;font-size:15.5px;}

  /* FORMACION */
  .path-grid{display:grid;grid-template-columns:1fr 1fr;gap:56px;}
  @media(max-width:860px){.path-grid{grid-template-columns:1fr;}}
  .timeline{list-style:none;margin:24px 0 0;padding:0;}
  .timeline li{
    display:grid;grid-template-columns:70px 1fr;gap:16px;padding:16px 0;border-top:1px solid var(--line);
  }
  .timeline li:first-child{border-top:none;}
  .timeline b{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--clay);}
  .timeline p{margin:0;font-size:14.5px;color:#3a4941;}
  .pub-list{list-style:none;margin:24px 0 0;padding:0;}
  .pub-list li{
    display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid var(--line);font-size:15px;
  }
  .pub-list li:first-child{border-top:none;}
  .pub-list span{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--moss);white-space:nowrap;}

  /* PRECIOS */
  .price-table{margin-top:40px;border-top:1px solid var(--line);}
  .price-row{
    display:grid;grid-template-columns:1fr auto;gap:14px;padding:18px 0;border-bottom:1px solid var(--line);align-items:baseline;
  }
  .price-row .name{font-size:16.5px;}
  .price-row .desc{font-size:13px;color:#5a6a61;display:block;margin-top:3px;}
  .price-row .price{font-family:'IBM Plex Mono',monospace;font-size:16px;color:var(--clay);white-space:nowrap;}
  .price-note{font-size:13px;color:#5a6a61;margin-top:18px;}

  /* TESTIMONIOS */
  .testi-wrap{overflow:hidden;margin-top:44px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);}
  .testi-track{display:flex;gap:20px;width:max-content;animation:scroll-x 60s linear infinite;}
  .testi-track:hover{animation-play-state:paused;}
  @keyframes scroll-x{from{transform:translateX(0);}to{transform:translateX(-50%);}}
  .testi-card{
    width:320px;flex:none;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;
  }
  .testi-card p{font-size:14.5px;color:#3a4941;margin:0 0 14px;font-family:'Fraunces',serif;font-style:italic;line-height:1.5;}
  .testi-card span{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--moss);text-transform:uppercase;letter-spacing:.05em;}

  /* MULTIMEDIA */
  .gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:40px;}
  @media(max-width:760px){.gallery{grid-template-columns:repeat(2,1fr);}}
  .gallery a{border-radius:12px;overflow:hidden;aspect-ratio:1/1;position:relative;display:block;}
  .gallery img{width:100%;height:100%;object-fit:cover;transition:transform .4s ease;}
  .gallery a:hover img{transform:scale(1.06);}
  .gallery .play{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(28,43,36,.28);
  }
  .gallery .play svg{width:38px;height:38px;}

  /* CONTACTO */
  .contact{background:var(--card);border-top:1px solid var(--line);}
  .contact-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;}
  @media(max-width:860px){.contact-grid{grid-template-columns:1fr;}}
  .contact h2{font-size:clamp(30px,4vw,44px);}
  .contact-list{list-style:none;margin:28px 0 0;padding:0;display:grid;gap:18px;}
  .contact-list li{display:grid;grid-template-columns:22px 1fr;gap:14px;font-size:15px;align-items:start;}
  .contact-list b{display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--moss);margin-bottom:2px;}
  .social-row{display:flex;gap:12px;margin-top:28px;}
  .social-row a{
    width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
    text-decoration:none;transition:.2s ease;
  }
  .social-row a:hover{background:var(--ink);color:var(--paper);}
  .contact-card{background:var(--ink);color:var(--paper);border-radius:var(--radius);padding:36px;}
  .contact-card h3{color:#fff;font-size:22px;}
  .contact-card p{color:#c3cec5;font-size:14.5px;}
  .contact-card .btn-solid{background:var(--paper);color:var(--ink);margin-top:18px;width:100%;justify-content:center;}
  .contact-card .btn-solid:hover{background:#fff;}

  footer{padding:36px 0;border-top:1px solid var(--line);}
  footer .wrap{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:#5a6a61;flex-wrap:wrap;gap:10px;}

  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    .testi-track{animation:none;}
    *{transition:none !important;}
  }

/* ===== NAV MOBILE TOGGLE ===== */
nav.mainnav a.active{opacity:1;font-weight:600;}
@media(max-width:880px){
  nav.mainnav{
    display:none;position:absolute;top:100%;left:0;right:0;
    background:var(--paper);border-bottom:1px solid var(--line);
    flex-direction:column;gap:0;padding:8px 0;
  }
  nav.mainnav.open{display:flex;}
  nav.mainnav a{padding:14px 28px;border-top:1px solid var(--line);}
  nav.mainnav a:first-child{border-top:none;}
  header .btn{display:none;}
}

/* ===== HOME TEASERS ===== */
.teaser-row{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:8px;}
.teaser-link{font-size:14px;font-weight:600;text-decoration:none;border-bottom:1px solid var(--ink);padding-bottom:2px;white-space:nowrap;}
.about-teaser{display:grid;grid-template-columns:.8fr 1.2fr;gap:48px;align-items:center;}
@media(max-width:800px){.about-teaser{grid-template-columns:1fr;}}
.about-teaser img{border-radius:var(--radius);border:1px solid var(--line);}
.mini-specialties{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:36px;}
@media(max-width:800px){.mini-specialties{grid-template-columns:repeat(2,1fr);}}
.mini-specialty{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;text-align:center;}
.mini-specialty h4{font-size:15.5px;margin:0;}
.reto-preview-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,.14);margin-top:40px;border:1px solid rgba(255,255,255,.14);}
@media(max-width:760px){.reto-preview-grid{grid-template-columns:1fr;}}
.testi-static-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:36px;}
@media(max-width:860px){.testi-static-grid{grid-template-columns:1fr;}}
.cta-band{background:var(--ink);color:#fff;text-align:center;}
.cta-band h2{color:#fff;font-size:clamp(28px,4vw,42px);max-width:20ch;margin:0 auto 18px;}
.cta-band .hero-ctas{justify-content:center;}
.page-hero{padding-top:56px;padding-bottom:24px;}
.page-hero .eyebrow{justify-content:center;}
.page-hero h1{text-align:center;font-size:clamp(30px,4.5vw,48px);}
.page-hero p{text-align:center;max-width:60ch;margin:14px auto 0;color:#3a4941;font-size:16.5px;}
.breadcrumb{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#5a6a61;text-align:center;margin-top:14px;}
.breadcrumb a{text-decoration:none;border-bottom:1px solid var(--line);}

/* ===== WHATSAPP FLOTANTE (todas las páginas) ===== */
.whatsapp-float{
  position:fixed;right:22px;bottom:22px;z-index:999;
  width:58px;height:58px;border-radius:50%;
  background:#25D366;display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 24px rgba(37,211,102,.45);
  transition:transform .2s ease, box-shadow .2s ease;
}
.whatsapp-float:hover{transform:scale(1.08);box-shadow:0 10px 28px rgba(37,211,102,.6);}
@media(max-width:600px){.whatsapp-float{width:52px;height:52px;right:16px;bottom:16px;}}

/* ===== CONTACTO PRO ===== */
.contact-hero{padding-top:56px;padding-bottom:8px;}
.trust-bar{
  display:flex;justify-content:center;gap:40px;flex-wrap:wrap;margin-top:36px;padding:22px 0;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
}
.trust-bar div{text-align:center;}
.trust-bar b{display:block;font-family:'Fraunces',serif;font-size:22px;}
.trust-bar span{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#5a6a61;letter-spacing:.05em;}

.whatsapp-hero{
  background:linear-gradient(135deg,#1ea952,#25D366);
  border-radius:24px;padding:44px;display:flex;align-items:center;gap:32px;flex-wrap:wrap;
  color:#fff;margin-top:48px;
}
.whatsapp-hero .icon{
  width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.18);
  display:flex;align-items:center;justify-content:center;flex:none;
}
